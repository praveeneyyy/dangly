name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Apple Silicon runner: the project is arm64-only.
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Not pinned to a version: the runner images change what they ship, and a
        # hardcoded path fails as "file not found" rather than as "too old".
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -switch "$newest"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          # Swift 6 language mode is required; fail early and clearly if absent.
          swift --version | grep -qE 'Swift version (6|[7-9])' \
            || { echo "::error::Hangly needs a Swift 6 toolchain"; exit 1; }

      - name: Lint
        run: |
          # Preinstalled on the macOS runners; installed here if that ever changes.
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint --version
          swiftlint lint --strict

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Hangly.xcodeproj \
            -scheme Hangly \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Hangly.xcodeproj \
            -scheme Hangly \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            test

      - name: Build for distribution
        run: |
          set -o pipefail
          xcodebuild \
            -project Hangly.xcodeproj \
            -scheme Hangly \
            -configuration Production \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            build

  build-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/Hangly.Windows.sln

      - name: Build
        run: dotnet build windows/Hangly.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/Hangly.Windows.sln --configuration Release --no-build --verbosity normal

